<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0a11">
<title>Sunny Charm</title>
<style nonce="__CSP_NONCE__">
:root{
  color-scheme:dark;
  --page:#09090f;
  --shell:#0d0d15;
  --rail:#11111a;
  --surface:#171721;
  --surface-2:#1d1c29;
  --surface-3:#232133;
  --input:#0f0f18;
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.13);
  --text:#f4f1fb;
  --muted:#a39dad;
  --faint:#6f6a79;
  --violet:#a17cff;
  --violet-2:#7d56e9;
  --pink:#f279bd;
  --cyan:#5cdcf5;
  --green:#44d792;
  --amber:#f5bd62;
  --red:#ff6b7d;
  --radius:18px;
  --shadow:0 18px 50px rgba(0,0,0,.32);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--page)}
body{
  min-height:100vh;min-height:100dvh;overflow:hidden;padding:14px;
  background:
    radial-gradient(circle at 18% 0%,rgba(129,92,224,.12),transparent 28%),
    radial-gradient(circle at 100% 100%,rgba(242,121,189,.07),transparent 28%),
    var(--page);
  color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--violet);outline-offset:2px
}
button:disabled{cursor:not-allowed;opacity:.5}
svg{display:block}
.app-shell{
  height:calc(100vh - 28px);height:calc(100dvh - 28px);display:grid;
  grid-template-columns:232px minmax(0,1fr);overflow:hidden;border:1px solid var(--line-strong);
  border-radius:24px;background:var(--shell);box-shadow:0 0 0 7px #30303a,var(--shadow)
}
.sidebar{
  min-width:0;display:flex;flex-direction:column;padding:18px 14px 14px;
  background:linear-gradient(180deg,#12121b 0%,#0f0f17 100%);border-right:1px solid var(--line)
}
.brand{display:flex;align-items:center;gap:11px;height:50px;padding:0 8px;margin-bottom:15px}
.brand-mark{
  width:36px;height:36px;display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:6px;
  border-radius:11px;background:linear-gradient(145deg,#bd9cff,#7456dc);box-shadow:0 9px 24px rgba(126,83,226,.32)
}
.brand-mark span{border-radius:3px;background:rgba(255,255,255,.88)}
.brand-mark span:nth-child(2),.brand-mark span:nth-child(3){border-radius:50%}
.brand-name{font-size:14px;font-weight:720;letter-spacing:-.2px}
.brand-kicker{font-size:10px;color:var(--faint);margin-top:2px}
.nav-label{
  display:block;padding:15px 11px 7px;color:var(--faint);font-size:9px;font-weight:760;
  letter-spacing:.12em;text-transform:uppercase
}
.sidebar nav{display:flex;flex:1;min-height:0;overflow-y:auto;flex-direction:column;gap:3px}
.nav-item{
  appearance:none;border:0;width:100%;min-height:42px;padding:0 11px;display:flex;align-items:center;gap:11px;
  border-radius:11px;background:transparent;color:var(--muted);font-size:12px;font-weight:580;text-align:left;
  cursor:pointer;transition:background .16s,color .16s,transform .16s
}
.nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:rgba(255,255,255,.045);color:var(--text)}
.nav-item:active{transform:scale(.98)}
.nav-item.active{
  color:#d8c9ff;background:linear-gradient(90deg,rgba(151,111,245,.22),rgba(151,111,245,.08));
  box-shadow:inset 2px 0 var(--violet)
}
.launch-note{
  margin-top:12px;padding:13px;border:1px solid rgba(161,124,255,.18);border-radius:14px;
  background:linear-gradient(145deg,rgba(161,124,255,.11),rgba(242,121,189,.035))
}
.launch-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;color:#d9ccfa}
.launch-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(245,189,98,.09)}
.launch-note p{font-size:10px;line-height:1.45;color:var(--faint);margin-top:8px}
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:0 24px;border-bottom:1px solid var(--line);background:rgba(13,13,21,.88);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:10
}
.workspace-switcher{
  appearance:none;border:1px solid var(--line);background:#12121c;color:var(--muted);height:38px;
  min-width:270px;max-width:44vw;border-radius:999px;padding:0 15px;display:flex;align-items:center;
  justify-content:space-between;gap:20px;font-size:11px;cursor:default
}
.workspace-switcher strong{color:var(--text);font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workspace-switcher svg{width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:2}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-button{
  appearance:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  background:var(--surface);color:var(--muted);cursor:pointer
}
.icon-button:hover{color:var(--text);border-color:var(--line-strong)}
.icon-button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.operator-avatar{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:760;
  color:#fff;background:linear-gradient(145deg,#f3bd77,#9166ea);border:2px solid rgba(255,255,255,.18)
}
.toggle-pill{
  appearance:none;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:8px;background:var(--surface);color:var(--text);cursor:pointer;
  font-size:10px;font-weight:680;transition:transform .15s,border-color .15s
}
.toggle-pill:hover{border-color:var(--line-strong)}
.toggle-pill:active{transform:scale(.97)}
[data-bot-dot]{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(68,215,146,.1)}
[data-bot-dot].off{background:var(--red);box-shadow:0 0 0 4px rgba(255,107,125,.09)}
.bot-control-group{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bot-control-reason{max-width:420px;color:var(--amber);font-size:10px;line-height:1.45;text-align:right}
.content{flex:1;overflow-y:auto;padding:24px;scrollbar-gutter:stable}
.content>*{width:min(1380px,100%);margin-inline:auto}
.content::-webkit-scrollbar,.sidebar nav::-webkit-scrollbar,.drawer-body::-webkit-scrollbar{width:9px}
.content::-webkit-scrollbar-thumb,.sidebar nav::-webkit-scrollbar-thumb,.drawer-body::-webkit-scrollbar-thumb{background:#292735;border-radius:10px;border:2px solid transparent;background-clip:padding-box}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}
.eyebrow{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);font-weight:760;margin-bottom:7px}
.page-head h1{font-size:27px;line-height:1.1;letter-spacing:-.75px;font-weight:700}
.page-head p{font-size:11px;line-height:1.5;color:var(--muted);margin-top:7px;max-width:590px}
.page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn,.btn-ghost,.btn-danger{
  appearance:none;min-height:38px;border-radius:10px;padding:0 14px;font-size:10px;font-weight:700;cursor:pointer;
  transition:transform .13s,background .13s,border-color .13s
}
.btn{border:0;color:white;background:linear-gradient(135deg,#a77fff,#7e55e9);box-shadow:0 8px 20px rgba(126,85,233,.22)}
.btn:hover{background:linear-gradient(135deg,#b28dff,#8c63ee)}
.btn-ghost{color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.btn-ghost:hover{color:var(--text);border-color:var(--line-strong)}
.btn-danger{color:#ffc2ca;border:1px solid rgba(255,107,125,.2);background:rgba(255,107,125,.08)}
.btn:active,.btn-ghost:active,.btn-danger:active{transform:scale(.97)}
.surface,.card,.panel,.block{
  border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(28,28,40,.96),rgba(21,21,31,.98));
  box-shadow:0 10px 30px rgba(0,0,0,.09)
}
.dashboard-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.status-card{grid-column:span 3;min-height:220px;padding:17px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.status-card::after{content:"";position:absolute;width:150px;height:150px;right:-65px;bottom:-80px;border-radius:50%;background:radial-gradient(circle,rgba(161,124,255,.26),transparent 67%)}
.hero-card{grid-column:span 6;min-height:220px;position:relative;overflow:hidden;padding:21px;text-align:center;border-color:rgba(161,124,255,.54);box-shadow:inset 0 0 0 1px rgba(242,121,189,.24),0 0 26px rgba(145,87,230,.18)}
.hero-card::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(56,221,255,.06),transparent 34%,rgba(242,121,189,.07))}
.hero-copy{position:relative;z-index:2}
.hero-copy h2{font-size:20px;font-weight:730;letter-spacing:-.45px;background:linear-gradient(90deg,#5fdcf4,#9b84ff,#f279bd,#f5ae6b);background-clip:text;-webkit-background-clip:text;color:transparent}
.hero-copy p{font-size:10px;color:var(--muted);margin-top:5px}
.aurora-wrap{position:absolute;inset:70px 0 0;display:grid;place-items:center;perspective:500px}
.aurora{
  width:210px;height:125px;border-radius:48% 52% 51% 49% / 57% 48% 52% 43%;
  background:conic-gradient(from 210deg,#f45ba5,#ff8e63,#ffd96c,#f16e93,#835df4,#58cbe5,#f45ba5);
  filter:saturate(1.1);transform:rotate(-8deg) skewX(-8deg);box-shadow:0 20px 44px rgba(219,85,176,.35)
}
.aurora::before,.aurora::after{content:"";position:absolute;inset:10px 15px;border-radius:inherit;border:4px solid rgba(255,255,255,.3);filter:blur(.2px)}
.aurora::after{inset:22px 34px;border-width:7px;opacity:.55}
.ops-card{grid-column:span 3;min-height:220px;padding:17px}
.mini-title{font-size:11px;font-weight:680;color:#d7d0df;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mini-title span{font-size:9px;color:var(--faint);font-weight:570}
.big-number{font-size:30px;line-height:1;font-weight:720;letter-spacing:-1px;margin-top:19px}
.muted-note{font-size:10px;line-height:1.45;color:var(--faint);margin-top:7px}
.spark{height:62px;margin-top:auto;display:flex;align-items:flex-end;gap:3px}
.spark i{display:block;flex:1;min-width:3px;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,var(--violet),rgba(161,124,255,.16))}
.metric-card{grid-column:span 3;min-height:124px;padding:16px}
.metric-card .label{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted)}
.metric-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(161,124,255,.12);color:#bda5ff}
.metric-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.metric-value{font-size:24px;font-weight:720;letter-spacing:-.65px;margin-top:12px}
.metric-foot{font-size:9px;color:var(--faint);margin-top:6px}
.metric-foot.good{color:var(--green)}.metric-foot.warn{color:var(--amber)}
.activity-card{grid-column:span 8;min-height:188px;padding:18px}
.next-card{grid-column:span 4;min-height:188px;padding:18px}
.heatmap{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:19px}
.heatmap i{aspect-ratio:1;border-radius:4px;background:#2b2839}
.heatmap i.on{background:#8466d6}.heatmap i.hot{background:#b89cff;box-shadow:0 0 12px rgba(184,156,255,.22)}
.queue-list{list-style:none;margin-top:13px}
.queue-list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}
.queue-list li:last-child{border-bottom:0}.queue-list strong{color:var(--text);font-weight:650}
.section-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.section-intro h2{font-size:15px;font-weight:680;letter-spacing:-.25px}
.section-intro p{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{padding:17px;min-width:0}
.card h3{font-size:10px;font-weight:600;color:var(--muted)}
.card .v{font-size:23px;line-height:1.1;font-weight:720;letter-spacing:-.65px;margin-top:12px;font-variant-numeric:tabular-nums}
.v.up{color:var(--green)}.v.warn{color:var(--amber)}.v.bad{color:var(--red)}
.panel{overflow:auto}
.panel table{width:100%;border-collapse:collapse}
.panel th{text-align:left;padding:12px 15px;font-size:8px;font-weight:760;color:var(--faint);text-transform:uppercase;letter-spacing:.09em;border-bottom:1px solid var(--line);white-space:nowrap}
.panel td{padding:13px 15px;font-size:10px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.panel tr:last-child td{border-bottom:0}.panel tr:hover td{background:rgba(255,255,255,.02)}
tr.clickable{cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:8px;font-weight:730;text-transform:capitalize}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.whale,.badge.tease{background:rgba(161,124,255,.12);color:#bda6ff}
.badge.avg,.badge.rapport,.badge.close{background:rgba(68,215,146,.1);color:var(--green)}
.badge.low{background:rgba(255,255,255,.06);color:var(--muted)}
.badge.offer,.badge.bad{background:rgba(255,107,125,.1);color:var(--red)}
.badge.handle{background:rgba(245,189,98,.1);color:var(--amber)}
.empty{min-height:330px;border:1px dashed var(--line-strong);border-radius:var(--radius);display:grid;place-items:center;text-align:center;padding:40px;background:rgba(255,255,255,.015)}
.empty-inner{max-width:390px}.empty .ico{width:50px;height:50px;margin:0 auto 16px;border-radius:15px;display:grid;place-items:center;background:rgba(161,124,255,.11);color:#bda6ff;font-size:20px}
.empty h3{font-size:16px}.empty p{font-size:10px;line-height:1.55;color:var(--muted);margin-top:7px}
.messages-layout{height:calc(100vh - 156px);height:calc(100dvh - 156px);min-height:500px;display:grid;grid-template-columns:330px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#101019}
.conversation-rail{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-right:1px solid var(--line);min-width:0;background:#12121c}
.conversation-toolbar{padding:14px;border-bottom:1px solid var(--line)}
.search-field{position:relative}
.search-field input{padding-left:34px}
.search-field svg{position:absolute;width:14px;height:14px;left:11px;top:50%;transform:translateY(-50%);stroke:var(--faint);fill:none;stroke-width:2}
.conversation-filters{display:flex;gap:6px;margin-top:10px}
.filter-pill{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);padding:5px 9px;font-size:8px}
.filter-pill.active{color:#ddceff;background:rgba(161,124,255,.12);border-color:rgba(161,124,255,.2)}
.conversation-list{flex:1;min-height:0;overflow-y:auto;padding:8px;overscroll-behavior:contain;scrollbar-gutter:stable}
.conversation-item{appearance:none;border:0;width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:9px;align-items:center;text-align:left;padding:10px;border-radius:12px;background:transparent;color:var(--text);cursor:pointer}
.conversation-item:hover,.conversation-item.active{background:rgba(161,124,255,.09)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:740;background:linear-gradient(145deg,#ce5de7,#7058e4);position:relative}
.avatar::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--green);border:2px solid #12121c;right:-1px;top:-1px}
.avatar.offline::after{background:var(--faint)}
.avatar.unknown::after{display:none}
.conversation-copy{min-width:0}.conversation-name{display:block;font-size:10px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conversation-preview{display:block;font-size:9px;color:var(--faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conversation-time{font-size:8px;color:var(--faint)}
.conversation-pane{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(145deg,#0d0d15,#101019)}
.conversation-empty{margin:auto;text-align:center;max-width:340px;padding:30px}
.conversation-empty .bubble-icon{width:56px;height:56px;margin:0 auto 17px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 35%,rgba(161,124,255,.35),rgba(161,124,255,.08));color:#cab7ff}
.conversation-empty svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6}
.conversation-empty h3{font-size:13px}.conversation-empty p{font-size:10px;line-height:1.5;color:var(--muted);margin-top:7px}
.chat-head{height:60px;flex:none;padding:0 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.chat-head h3{font-size:12px}.chat-head p{font-size:9px;color:var(--faint);margin-top:3px}
.chat-body{flex:1;overflow-y:auto;padding:18px}
.msg{display:flex;margin-bottom:10px}.msg.creator{justify-content:flex-end}
.msgwrap{display:flex;flex-direction:column;max-width:76%}.msg.creator .msgwrap{align-items:flex-end}
.bubble{padding:10px 13px;border-radius:15px;font-size:10px;line-height:1.5}
.msg.fan .bubble{background:var(--surface-2);border:1px solid var(--line);color:#ded9e5;border-bottom-left-radius:4px}
.msg.creator .bubble{background:linear-gradient(135deg,#9e76f3,#7b55dd);color:white;border-bottom-right-radius:4px}
.who{font-size:8px;color:var(--faint);margin-top:4px}
.fan-summary{display:flex;align-items:center;gap:8px}.pill-row{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:5px 8px;border-radius:999px;font-size:8px;color:var(--muted);background:rgba(255,255,255,.045);border:1px solid var(--line)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.media-card{min-height:172px;overflow:hidden;border-radius:15px;border:1px solid var(--line);background:var(--surface);position:relative;padding:13px;display:flex;flex-direction:column}
.media-preview{height:88px;border-radius:10px;background:linear-gradient(145deg,#242432,#191923);display:grid;place-items:center;color:var(--faint);font-size:21px;margin-bottom:12px}
.media-card .name{font-size:9px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-card .size{font-size:8px;color:var(--faint);margin-top:5px}.media-card .media-state{font-size:8px;color:var(--amber);margin-top:auto;padding-top:8px}
.cat{margin-bottom:18px}.cat h4{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin:0 0 8px 4px}
.block{padding:19px;margin-bottom:13px}.block h3{font-size:14px;margin-bottom:14px}
.block-copy{font-size:10px;color:var(--muted);line-height:1.5;margin:-7px 0 14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row{display:flex;align-items:center;gap:9px;margin-bottom:10px}
label{display:block;font-size:9px;font-weight:640;color:var(--muted);margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--text);padding:10px 11px;font-size:10px;transition:border-color .14s,box-shadow .14s}
input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(161,124,255,.65);box-shadow:0 0 0 3px rgba(161,124,255,.1)}
textarea{min-height:180px;line-height:1.55;resize:vertical;font-family:"SFMono-Regular",Consolas,monospace}
.done{display:none;font-size:9px;color:var(--green)}#conn-result{font-size:9px;color:var(--muted)}
.drawer{position:fixed;inset:14px 14px 14px auto;width:500px;max-width:calc(100vw - 28px);z-index:60;display:flex;flex-direction:column;border:1px solid var(--line-strong);border-radius:20px;background:rgba(18,18,27,.98);box-shadow:-30px 0 80px rgba(0,0,0,.45);transform:translateX(calc(100% + 28px));transition:transform .22s ease;backdrop-filter:blur(20px)}
.drawer.open{transform:translateX(0)}.drawer-head{height:62px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:14px}.drawer-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.drawer-body{flex:1;overflow-y:auto;padding:17px}.drawer-section{margin-bottom:22px}.drawer-section h4{font-size:8px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:9px}

  .brand,.nav-label,.launch-note{display:none}
  .sidebar nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(66px,1fr);overflow-x:auto;gap:0}
  .sidebar nav{scrollbar-width:none}.sidebar nav::-webkit-scrollbar{display:none}
  .nav-item{min-height:58px;padding:5px 2px;justify-content:center;flex-direction:column;gap:3px;font-size:8px;box-shadow:none!important}

  .topbar{height:62px;padding:0 13px}.workspace-switcher{min-width:0;max-width:none;flex:1}.workspace-switcher span{display:none}
  .icon-button{display:none}.operator-avatar{width:34px;height:34px}.toggle-pill{min-height:34px;padding:0 10px}
  .content{padding:17px 13px 30px}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:23px}.page-actions{justify-content:flex-start}
  .dashboard-grid{gap:9px}.status-card,.ops-card,.hero-card,.metric-card,.activity-card,.next-card{grid-column:span 12}.hero-card{min-height:218px}
  .cards,.g2,.g3{grid-template-columns:1fr}.messages-layout{height:calc(100dvh - 168px);grid-template-columns:1fr}.conversation-pane{display:none}.conversation-rail{border-right:0}
  .messages-layout.chat-open .conversation-rail{display:none}.messages-layout.chat-open .conversation-pane{display:flex}
  .panel{border-radius:14px}.drawer{inset:0;width:100%;max-width:none;border-radius:0}.media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:420px){.cards{grid-template-columns:1fr}.media-grid{grid-template-columns:1fr}.metric-card{grid-column:span 12}.content{padding-inline:11px}}

<script nonce="__CSP_NONCE__">
const CSRF_TOKEN=__CSRF_TOKEN__;
var currentTab='dashboard';
var conversationData=[];
var conversationTotal=0;
var conversationOffset=0;
var conversationPageSize=200;
var conversationSearch='';
var conversationSearchTimer=null;
var conversationDiscoveryComplete=true;
var conversationLiveSyncAvailable=false;
var activeConversationId='';
var activeConversationMessages=[];
var activeConversationDetail=null;
var editSeqId=null;
var dashboardAlbums=[];
var dashboardSteps=[];
var dashboardSequenceEditingAvailable=false;
var dashboardPaidMessagesSupported=false;
var dashboardPpvReason='';
var dashboardVaultAlbumsSupported=false;
var dashboardVaultReason='';
var dashboardMediaAssets=[];
var dashboardScripts=[];
var editScriptId=null;
var dashboardScriptDraft={};
var dashboardPersona={};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function attr(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function money(v){return '$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function initial(s){var v=String(s||'F').trim();return(v[0]||'F').toUpperCase()}
function B(c,t){var allowed=['whale','avg','low','rapport','tease','offer','handle','close','bad'];c=allowed.indexOf(c)>=0?c:'low';return'<span class="badge '+c+'">'+esc(t)+'</span>'}
function ft(t){if(!t)return'—';var d=new Date(String(t).endsWith('Z')?t:t+'Z'),s=Math.max(0,Math.floor((new Date()-d)/1000));if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'}
function emptyState(icon,title,description){return'<div class="empty"><div class="empty-inner"><div class="ico" aria-hidden="true">'+icon+'</div><h3>'+esc(title)+'</h3><p>'+esc(description)+'</p></div></div>'}
function pageHead(kicker,title,description,actions){return'<div class="page-head"><div><div class="eyebrow">'+esc(kicker)+'</div><h1>'+esc(title)+'</h1><p>'+esc(description)+'</p></div><div class="page-actions">'+(actions||'')+'</div></div>'}
function sectionIntro(title,description,action){return'<div class="section-intro"><div><h2>'+esc(title)+'</h2><p>'+esc(description)+'</p></div>'+(action||'')+'</div>'}
function botControlMarkup(){return'<div class="bot-control-group"><button type="button" class="btn" data-action="toggle-bot" data-bot-control data-off-label="Start bot" data-on-label="Stop bot" data-blocked-label="Start blocked" aria-label="Toggle bot"><span class="dot off" data-bot-dot></span><span data-bot-label>Checking…</span></button><span class="bot-control-reason" data-bot-reason aria-live="polite"></span></div>'}
async function F(u){try{var r=await fetch(u,{credentials:'same-origin',cache:'no-store'});if(!r.ok)return null;return await r.json()}catch(e){return null}}
async function M(u,options){options=options||{};options.credentials='same-origin';options.cache='no-store';options.headers=Object.assign({},options.headers||{}, {'X-CSRF-Token':CSRF_TOKEN});return fetch(u,options)}

var loaders={dashboard:loadDashboard,funnel:loadFunnel,fans:loadFans,kpis:loadKPIs,scripts:loadScripts,sequences:loadSequences,vault:loadVault,brain:loadBrain,settings:loadSettings};
function navTo(tab,skipHash){
  if(!loaders[tab])tab='dashboard';
  currentTab=tab;
  document.querySelectorAll('.nav-item').forEach(function(item){item.classList.toggle('active',item.dataset.tab===tab);if(item.dataset.tab===tab)item.setAttribute('aria-current','page');else item.removeAttribute('aria-current')});
  document.getElementById('content').scrollTop=0;
  if(!skipHash&&location.hash!=='#'+tab)history.replaceState(null,'','#'+tab);
  loaders[tab]();
}
function refreshCurrent(){if(loaders[currentTab])loaders[currentTab]()}

function metricIcon(path){return'<span class="metric-icon"><svg viewBox="0 0 24 24" aria-hidden="true">'+path+'</svg></span>'}
function metricCard(label,value,foot,path,footClass){return'<article class="metric-card surface"><div class="label"><span>'+esc(label)+'</span>'+metricIcon(path)+'</div><div class="metric-value">'+esc(value)+'</div><div class="metric-foot '+(footClass||'')+'">'+esc(foot)+'</div></article>'}
function heatmap(seed){
  var h='<div class="heatmap" aria-label="Recent activity matrix">';
  for(var i=0;i<70;i++){var n=(i*7+seed*3+i%9)%17;h+='<i class="'+(n>12?'hot':n>6?'on':'')+'"></i>'}
  return h+'</div>';
}
function sparkBars(seed){
  var h='<div class="spark" aria-hidden="true">';
  for(var i=0;i<18;i++){var height=18+((i*13+seed*7)%43);h+='<i style="height:'+height+'px"></i>'}
  return h+'</div>';
}
function loadDashboard(){
  var c=document.getElementById('content');
  c.innerHTML=pageHead('Creator intelligence','Welcome back, Sunny Charm','A truthful view of conversations, revenue, provider readiness, and controlled-launch state.','<button class="btn-ghost" data-action="refresh-view">Refresh data</button><button class="btn" data-action="open-messages">Open inbox</button>')+
    '<div class="dashboard-grid"><article class="status-card surface"><div class="mini-title">Audience pulse <span>Live</span></div><div class="big-number">—</div><div class="muted-note">Loading known fans and active conversations.</div>'+sparkBars(3)+'</article>'+
    '<article class="hero-card surface"><div class="hero-copy"><h2>Creator Intelligence</h2><p>Revenue operations powered by durable data</p></div><div class="aurora-wrap"><div class="aurora"></div></div></article>'+
    '<article class="ops-card surface"><div class="mini-title">Launch readiness <span>Checking</span></div><ul class="queue-list"><li><span>Database</span><strong>—</strong></li><li><span>Provider</span><strong>—</strong></li><li><span>Bot state</span><strong>—</strong></li></ul></article></div>';
  Promise.all([F('/api/kpis'),F('/api/conversations'),F('/api/bot/status'),F('/api/operations')]).then(function(r){
    var k=r[0]||{},con=r[1]||{fans:[]},bot=r[2]||{},ops=r[3]||{};
    var fans=con.fans||[];
    var pulse='<article class="status-card surface"><div class="mini-title">Audience pulse <span>'+fans.length+' profiles</span></div><div class="big-number">'+Number(k.known_fans||fans.length||0).toLocaleString()+'</div><div class="muted-note">Known fans in durable creator state.</div>'+sparkBars(Number(k.sent_outbounds||0)+fans.length)+'</article>';
    var hero='<article class="hero-card surface"><div class="hero-copy"><h2>Creator Intelligence</h2><p>Revenue operations powered by durable data</p></div><div class="aurora-wrap"><div class="aurora"></div></div></article>';
    var provider=ops.provider&&ops.provider.connected?'Ready':'Offline';
    var botState=bot.enabled?'Running':'Paused';
    var readiness='<article class="ops-card surface"><div class="mini-title">Launch readiness <span>'+(bot.launch_ready?'Ready':'Guarded')+'</span></div><ul class="queue-list"><li><span>Database</span><strong style="color:'+(ops.database_ready?'var(--green)':'var(--red)')+'">'+(ops.database_ready?'Ready':'Unavailable')+'</strong></li><li><span>Provider</span><strong style="color:'+(provider==='Ready'?'var(--green)':'var(--red)')+'">'+provider+'</strong></li><li><span>Bot state</span><strong style="color:'+(bot.enabled?'var(--green)':'var(--amber)')+'">'+botState+'</strong></li></ul></article>';
    var metrics=[
      metricCard('Attributed revenue',money(k.attributed_revenue),'Exact provider purchase events','<path d="M12 3v18M16 7.5c0-1.7-1.8-3-4-3s-4 1.3-4 3 1.8 3 4 3 4 1.3 4 3-1.8 3-4 3-4-1.3-4-3"/>','good'),
      metricCard('Purchases',Number(k.attributed_purchases||0).toLocaleString(),'Durably attributed','<path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/>','good'),
      metricCard('Sent messages',Number(k.sent_outbounds||0).toLocaleString(),'Confirmed provider sends','<path d="m3 11 18-8-8 18-2-8zM11 13l5-5"/>',''),
      metricCard('Average response',k.response_time_avg==null?'N/A':Number(k.response_time_avg).toFixed(1)+'s',k.response_time_avg==null?'Awaiting enough events':'Across completed replies','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',k.response_time_avg==null?'warn':'good')
    ].join('');
    var pipeline=ops.pipeline||{},crm=ops.crm_sync||{};
    var activity='<article class="activity-card surface"><div class="mini-title">Message activity <span>Durable pipeline</span></div>'+heatmap(Number(k.sent_outbounds||0)+Number(k.completed_inbounds||0))+'<div class="muted-note">Intensity is a compact operational pulse, not fabricated revenue.</div></article>';
    var next='<article class="next-card surface"><div class="mini-title">Operations queue <span>Now</span></div><ul class="queue-list"><li><span>CRM messages stored</span><strong>'+Number(crm.stored_messages||0).toLocaleString()+'</strong></li><li><span>Histories still syncing</span><strong style="color:'+(Number(crm.pending_chats||0)?'var(--amber)':'var(--green)')+'">'+Number(crm.pending_chats||0)+'</strong></li><li><span>CRM sync failures</span><strong style="color:'+(Number(crm.failed_chats||0)?'var(--red)':'var(--green)')+'">'+Number(crm.failed_chats||0)+'</strong></li><li><span>Automated replies</span><strong>'+(bot.enabled?'Enabled':'Paused')+'</strong></li></ul></article>';
    c.innerHTML=pageHead('Creator intelligence','Welcome back, Sunny Charm','A truthful view of conversations, revenue, provider readiness, and controlled-launch state.','<button class="btn-ghost" data-action="refresh-view">Refresh data</button><button class="btn" data-action="open-messages">Open inbox</button>')+
      '<div class="dashboard-grid">'+pulse+hero+readiness+metrics+activity+next+'</div>';
  });
}

function renderConversationList(fans){
  if(!fans.length)return'<div style="padding:12px">'+emptyState('◇','No conversations','New fan messages will appear here automatically.')+'</div>';
  var rows=fans.map(function(f){
    var fid=String(f.fan_id||''),name=f.display_name||f.username||fid.slice(0,12),handle=f.username?'@'+String(f.username).replace(/^@/,''):'',presence=['online','offline'].includes(f.presence)?f.presence:'unknown',pending=f.history_complete?'':conversationLiveSyncAvailable?'Syncing history · ':'Stored preview · ',preview=(presence==='online'?'Online now · ':presence==='offline'&&f.last_seen_at?'Last seen '+ft(f.last_seen_at)+' · ':'')+pending+(handle?handle+' · ':'')+Number(f.message_count||0)+' messages';
    return'<button type="button" class="conversation-item'+(activeConversationId===fid?' active':'')+'" data-action="select-conversation" data-fan-id="'+attr(fid)+'"><span class="avatar '+presence+'">'+esc(initial(name))+'</span><span class="conversation-copy"><span class="conversation-name">'+esc(name)+'</span><span class="conversation-preview">'+esc(preview)+'</span></span><span class="conversation-time">'+esc(ft(f.last_activity))+'</span></button>';
  }).join('');
  if(fans.length<conversationTotal)rows+='<div style="padding:12px;text-align:center"><button class="btn-ghost" data-action="load-more-conversations">Load more conversations</button></div>';
  return rows;
}
function loadFunnel(){
  var c=document.getElementById('content');
  activeConversationId='';
  activeConversationMessages=[];
  activeConversationDetail=null;
  conversationSearch='';
  c.innerHTML=pageHead('Messages','Inbox','Review live conversations and buying stages without losing durable fan context.','<button class="btn-ghost" data-action="refresh-view">Refresh</button>'+botControlMarkup())+
    '<div class="messages-layout" id="messages-layout"><section class="conversation-rail"><div class="conversation-toolbar"><div class="search-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input id="conversation-search" type="search" placeholder="Search conversations…" aria-label="Search conversations"></div><div class="conversation-filters"><span class="filter-pill active">All</span><span class="filter-pill">Recent</span><span class="filter-pill">Controlled launch</span></div></div><div class="conversation-list" id="conversation-list"><p style="padding:15px;color:var(--faint);font-size:10px">Loading…</p></div></section><section class="conversation-pane" id="conversation-pane"><div class="conversation-empty"><div class="bubble-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3z"/></svg></div><h3>Select a conversation</h3><p>Choose a fan from the list to inspect messages, memory, purchase context, and funnel progress.</p></div></section></div>';
  loadConversationList(true);loadBotStatus();
}
function loadConversationList(reset){
  if(reset)conversationOffset=0;
  var list=document.getElementById('conversation-list');if(!list)return;
  var url='/api/conversations?limit='+conversationPageSize+'&offset='+conversationOffset+'&search='+encodeURIComponent(conversationSearch);
  F(url).then(function(d){
    if(!d){if(reset)list.innerHTML=emptyState('!','Inbox unavailable','The durable conversation index could not be loaded.');return}
    var incoming=d.fans||[];
    if(reset)conversationData=incoming;
    else{
      var known={};conversationData.forEach(function(f){known[String(f.fan_id)]=true});
      incoming.forEach(function(f){if(!known[String(f.fan_id)])conversationData.push(f)});
    }
    conversationTotal=Number(d.total||conversationData.length);
    conversationOffset=conversationData.length;
    conversationDiscoveryComplete=d.discovery_complete!==false;
    conversationLiveSyncAvailable=d.live_sync_available===true;
    list.innerHTML=renderConversationList(conversationData);
  });
}
function filterConversations(query){
  conversationSearch=String(query||'').trim();
  if(conversationSearchTimer)clearTimeout(conversationSearchTimer);
  conversationSearchTimer=setTimeout(function(){loadConversationList(true)},250);
}
function selectConversation(fanId){
  activeConversationId=fanId;
  activeConversationMessages=[];

  var el=document.getElementById('steps-container');if(!el)return;var old=document.getElementById('media-picker');if(old)old.remove();
  var cards=dashboardMediaAssets.map(function(m){var preview=m.thumbnail_url?'<img src="'+attr(m.thumbnail_url)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px">':m.media_type==='video'?'▶':'◫';return'<button class="media-card" data-action="select-media" data-step-index="'+idx+'" data-media-id="'+attr(m.provider_media_id)+'" data-preview-id=""><div class="media-preview">'+preview+'</div><div class="name">'+esc(m.title)+'</div><div class="size">'+esc((m.tags||[]).join(' · ')||m.media_type)+'</div><div class="media-state">Select</div></button>'}).join('');
  var albums=dashboardAlbums.map(function(a){return'<option value="'+attr(a.id)+'">'+esc(a.name||'Album')+'</option>'}).join('');
  el.insertAdjacentHTML('afterbegin','<section class="block" id="media-picker"><div class="section-intro"><div><h2>Select provider media</h2><p>Choose a registered item or browse the connected Fansly vault.</p></div></div>'+(cards?'<div class="media-grid">'+cards+'</div>':'')+(albums?'<label for="album-picker">Fansly vault album</label><select id="album-picker" data-step-index="'+idx+'">'+albums+'</select><div id="album-media-list" style="margin-top:12px"></div>':'')+'</section>');
  if(albums)loadAlbumMedia(idx);
}
function loadAlbumMedia(idx){var sel=document.getElementById('album-picker'),el=document.getElementById('album-media-list');if(!sel||!el)return;el.innerHTML='<p class="muted-note">Loading album…</p>';F('/api/vault-albums/'+encodeURIComponent(sel.value)+'/media').then(function(d){var items=d&&d.media||[];if(!items.length){el.innerHTML=emptyState('□','No media','This album returned no selectable media.');return}el.innerHTML='<div class="media-grid">'+items.map(function(m){var visual=m.previewUrl?(m.type==='video'?'<video src="'+attr(m.previewUrl)+'" muted preload="metadata" style="width:100%;height:100%;object-fit:cover;border-radius:10px"></video>':'<img src="'+attr(m.previewUrl)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:10px">'):(m.type==='video'?'▶':'◫');return'<button class="media-card" data-action="select-media" data-step-index="'+idx+'" data-media-id="'+attr(m.mediaId||m.id)+'" data-preview-id="'+attr(m.previewId||'')+'"><div class="media-preview">'+visual+'</div><div class="name">'+esc(m.label||m.mediaId||m.id)+'</div><div class="size">'+esc(m.type||'media')+'</div><div class="media-state">Select from vault</div></button>'}).join('')+'</div>'})}
function selectMedia(idx,mid,pid){var inp=document.getElementById('smedia_'+idx),preview=document.getElementById('spreview_'+idx);if(inp)inp.value=mid;if(preview)preview.value=pid||'';var picker=document.getElementById('media-picker');if(picker)picker.remove()}
function saveSeq(){
  var name=document.getElementById('sname').value,trigger=document.getElementById('strigger').value,funnel=document.getElementById('sfunnel').value,active=document.getElementById('sactive').value==='1';
  var stepData=dashboardSteps.map(function(s,i){return{position:i+1,media_id:(document.getElementById('smedia_'+i)||{}).value||'',preview_id:(document.getElementById('spreview_'+i)||{}).value||'',price:parseFloat((document.getElementById('sprice_'+i)||{}).value)||0,tease_script:(document.getElementById('stease_'+i)||{}).value||'',offer_script:(document.getElementById('soffer_'+i)||{}).value||''}});
  var url='/api/sequences'+(editSeqId?'/'+editSeqId:'');
  M(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,trigger:trigger,funnel_stage:funnel,is_active:active,steps:stepData})}).then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}})}).then(function(x){if(!x.ok){alert(x.data.error||'Save failed');return}loadSequences()});
}
function deleteSeq(id){if(!confirm('Delete this flow?'))return;M('/api/sequences/'+id,{method:'DELETE'}).then(function(r){if(r.ok)loadSequences()})}

async function loadBotStatus(){
  try{
    var r=await fetch('/api/bot/status',{credentials:'same-origin',cache:'no-store'});
    if(!r.ok)throw new Error('Status request failed');
    var d=await r.json();
    updateToggleUI(Boolean(d.enabled),Boolean(d.available),d.reason||d.launch_block_reason||'',d.consistent!==false,d.launch_ready!==false);
    var copy=document.getElementById('launch-copy'),dot=document.getElementById('launch-dot');
    if(copy)copy.textContent=(d.mode==='conversation'?'Conversation mode · PPV disabled · ':'')+(d.controlled_launch?(d.allowed_fan_count+' pilot fan'+(d.allowed_fan_count===1?'':'s')+' allowed · bot '+(d.enabled?'running':'paused')):'Controlled launch is not active');
    if(dot)dot.style.background=d.enabled?'var(--green)':'var(--amber)';
  }catch(e){
    updateToggleUI(false,false,'Status request failed',false,false);
    var copy=document.getElementById('launch-copy');
    if(copy)copy.textContent='Status unavailable';
  }
}
function updateToggleUI(enabled,available,reason,consistent,launchReady){
  var blocked=available&&!enabled&&!launchReady,detail=reason||(!consistent?'Runtime and persisted state disagree':'');
  document.querySelectorAll('[data-bot-control]').forEach(function(button){
    var dot=button.querySelector('[data-bot-dot]'),label=button.querySelector('[data-bot-label]');
    if(dot)dot.className='dot'+(enabled&&available?'':' off');
    if(label){label.textContent=!available?'Unavailable':blocked?(button.dataset.blockedLabel||'Start blocked'):enabled?(button.dataset.onLabel||'Bot on'):(button.dataset.offLabel||'Bot off');label.style.color=enabled?'var(--green)':blocked?'var(--amber)':'var(--red)'}
    button.disabled=!available||blocked;button.title=detail;button.setAttribute('aria-pressed',enabled?'true':'false');button.setAttribute('aria-label',!available?'Bot unavailable':blocked?'Bot start blocked: '+detail:enabled?'Turn bot off':'Turn bot on');
  });
  document.querySelectorAll('[data-bot-reason]').forEach(function(el){el.textContent=blocked||!available?detail:''});
}
async function toggleBot(button){
  if(!button||button.disabled)return;var target=button.getAttribute('aria-pressed')!=='true';
  document.querySelectorAll('[data-bot-control]').forEach(function(control){control.disabled=true});
  try{var r=await M('/api/bot/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:target})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Toggle failed');await loadBotStatus()}catch(e){button.title=e.message||'Toggle failed';await loadBotStatus()}
}

document.addEventListener('click',function(event){
  var nav=event.target.closest('.nav-item[data-tab]');if(nav){navTo(nav.dataset.tab);return}
  var control=event.target.closest('[data-action]');if(!control)return;
  var action=control.dataset.action,stepIndex=Number(control.dataset.stepIndex),sequenceId=Number(control.dataset.sequenceId),scriptIndex=Number(control.dataset.scriptIndex),scriptId=Number(control.dataset.scriptId),mediaAssetId=Number(control.dataset.mediaAssetId);
  if(action==='refresh-view')refreshCurrent();
  else if(action==='open-messages')navTo('funnel');
  else if(action==='toggle-bot')toggleBot(control);
  else if(action==='close-drawer')closeDrawer();
  else if(action==='fan-detail')fanDetail(control.dataset.fanId||'');
  else if(action==='select-conversation')selectConversation(control.dataset.fanId||'');
  else if(action==='load-more-conversations')loadConversationList(false);
  else if(action==='load-older-messages')loadConversationPage(control.dataset.fanId||activeConversationId,activeConversationMessages.length,true);
  else if(action==='test-connection')testConn();
  else if(action==='save-ai-settings')saveAISettings();
  else if(action==='test-ai-connection')testAIConnection();
  else if(action==='load-persona')loadPersona();
  else if(action==='save-persona')savePersona();
  else if(action==='save-chat-instructions')saveChatInstructions();
  else if(action==='save-brain-settings')saveBrainSettings();
  else if(action==='load-brain-fan')loadBrainFan();
  else if(action==='pause-brain-experiment')pauseBrainExperiment(control.dataset.id);
  else if(action==='save-brand-bible')saveBible();
  else if(action==='new-script')newScript();
  else if(action==='load-scripts')loadScripts();
  else if(action==='save-script')saveScript();
  else if(action==='edit-script'&&Number.isInteger(scriptIndex))editScript(scriptIndex);
  else if(action==='delete-script'&&Number.isInteger(scriptId)){event.stopPropagation();deleteScript(scriptId)}
  else if(action==='new-media-asset')mediaAssetEditor();
  else if(action==='load-vault')loadVault();
  else if(action==='save-media-asset')saveMediaAsset();
  else if(action==='delete-media-asset'&&Number.isInteger(mediaAssetId))deleteMediaAsset(mediaAssetId);
  else if(action==='new-sequence')newSequence();
  else if(action==='load-sequences')loadSequences();
  else if(action==='save-sequence')saveSeq();
  else if(action==='edit-sequence'&&Number.isInteger(sequenceId))editSeq(sequenceId);
  else if(action==='delete-sequence'&&Number.isInteger(sequenceId)){event.stopPropagation();deleteSeq(sequenceId)}
  else if(action==='add-step')addStep();
  else if(action==='remove-step'&&Number.isInteger(stepIndex))removeStep(stepIndex);
  else if(action==='pick-media'&&Number.isInteger(stepIndex))pickMedia(stepIndex);
  else if(action==='select-media'&&Number.isInteger(stepIndex))selectMedia(stepIndex,control.dataset.mediaId||'',control.dataset.previewId||'');
});

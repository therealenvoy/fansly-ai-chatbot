name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime and test runner
        run: python -m pip install --requirement requirements.txt "pytest>=8,<10"
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run core suite
        run: >-
          python -m pytest -q
          --ignore=tests/emotion
          --ignore=tests/integration/test_emotion_system.py
          --ignore=tests/integration/test_postgres_runtime.py

  postgres:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fansly_test
          POSTGRES_USER: fansly
          POSTGRES_PASSWORD: fansly-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fansly -d fansly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://fansly:fansly-test-password@127.0.0.1:5432/fansly_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and test runner
        run: python -m pip install --requirement requirements.txt "pytest>=8,<10"
      - name: Run PostgreSQL integration
        run: python -m pytest -q tests/integration/test_postgres_runtime.py

  emotion:
    name: Optional emotion system
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install full development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run emotion suite
        run: >-
          python -m pytest -q
          tests/emotion
          tests/integration/test_emotion_system.py
